name: CareBase CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest test_app.py -v

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t carebase:v1 .

      - name: Run container
        run: docker run -d -p 5000:5000 --name carebase-test carebase:v1

      - name: Wait for container startup
        run: sleep 5

      - name: Health check
        run: curl --fail http://localhost:5000/health

      - name: Stop and remove container
        run: |
          docker stop carebase-test
          docker rm carebase-test
